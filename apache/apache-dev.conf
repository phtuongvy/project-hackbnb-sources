ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

<IfModule unixd_module>
    User www-data
    Group www-data
</IfModule>

ServerName localhost

# Information disclosure: hide Apache version / OS in "Server" header and error pages
ServerTokens Prod
ServerSignature Off
FileETag None

ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<IfModule headers_module>
    RequestHeader unset Proxy early
</IfModule>

ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# Security headers (mitigation XSS / clickjacking / MIME sniffing)
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-NEZvGkT0ZWP6XHdKYM4B1laRPcM6Lw4LJfkDtIEVAKc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws://localhost:9000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"

# Remove headers leaking server technology / versions (e.g. "Werkzeug/x Python/x") and ETag
Header always unset Server
Header unset Server
Header always unset X-Powered-By
Header unset X-Powered-By
Header always unset ETag
Header unset ETag

# Back-end
ProxyPass /api/ http://back:9001/
ProxyPassReverse /api/ http://back:9001/

# Front-end (dev only: the hash above allows Vite's React Refresh inline preamble,
# upgrade=websocket proxies Vite's HMR websocket)
ProxyPass / http://front:9000/ upgrade=websocket
ProxyPassReverse / http://front:9000/
